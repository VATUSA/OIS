<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OIS</title>
    <!-- Set the theme class before first paint so a dark-default app never flashes light.
         Mirrors ThemeProvider (storageKey "ois-theme", default "dark"). -->
    <script>
      try {
        var t = localStorage.getItem("ois-theme") || "dark";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) { document.documentElement.classList.add("dark"); }
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Runtime config (window.__OIS_API_URL__ / __OIS_DOCS_URL__). Empty in dev; injected into
         config.js in prod images. The ?v query is a distinct cache key so a CDN can't pin a stale
         copy against the bare /config.js path; the file itself is served no-store. Bump on the
         rare occasion a CDN has poisoned the current key. -->
    <script src="/config.js?v=2"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
