# GENERATED — do not edit by hand. Regenerate with deploy/observability/gen-portainer-compose.sh
# (source of truth is deploy/observability/*).
#
# Self-contained observability stack for a Portainer web-editor (paste-the-YAML) deployment: it
# carries its Prometheus + Grafana config INLINE as Docker configs, so there are no bind mounts and
# nothing has to exist on the host. Deploy it as its own Portainer stack, separate from the base
# OIS stack.
#
#   1. Deploy the base OIS stack (docker-compose.yml) first — it creates the shared network.
#   2. New stack -> Web editor -> paste this file. Set OIS_NETWORK to your base stack's network
#      (its name is "<base-stack-name>_default"; check Portainer -> Networks or `docker network
#      ls`). Default below is ois_default.
#   3. Reach Grafana at ${GRAFANA_PORT:-3001}; log in with GRAFANA_ADMIN_PASSWORD. The Prometheus
#      datasource and the OIS dashboard are already provisioned.
#
# Requires a Compose that supports inline `configs` content (Docker Compose v2.23.1+); Portainer
# 2.19+ ships one. /metrics is unauthenticated but only scraped in-network; see docs/deploy.md to
# gate it with METRICS_TOKEN.
services:
  prometheus:
    image: prom/prometheus:v3.7.3
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - ois_prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/ois.yml
      - source: grafana_dashboard_ois
        target: /etc/grafana/dashboards/ois-overview.json
    volumes:
      - ois_grafana:/var/lib/grafana
    ports:
      - "${BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    restart: unless-stopped

# The base OIS stack's network, joined as external so Prometheus can scrape backend:3000 in-network
# without this stack redefining any of those services.
networks:
  default:
    external: true
    name: ${OIS_NETWORK:-ois_default}

volumes:
  ois_prometheus:
  ois_grafana:

configs:
  prometheus_config:
    content: |
      # Prometheus scrape config for the OIS observability stack (#382).
      #
      # Mounted read-only at /etc/prometheus/prometheus.yml by docker-compose.observability.yml. Because
      # that file is merged with the base compose file, this container shares the stack's network and can
      # address the API by its service name.
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
        external_labels:
          stack: ois
      
      scrape_configs:
        - job_name: ois-backend
          metrics_path: /metrics
          static_configs:
            - targets: ["backend:3000"]
      
          # The endpoint is open by default. That is fine for this scrape — it never leaves the compose
          # network — but /metrics shares the API's listener, so it is reachable wherever the API is. If
          # you proxy the API publicly, set METRICS_TOKEN (below) or block /metrics at the proxy.
          #
          # To require a token instead, set METRICS_TOKEN on the backend, then write that same value to
          # deploy/observability/metrics_token, uncomment the volume line for it in
          # docker-compose.observability.yml, and uncomment the block below. Prometheus does not expand
          # environment variables in this file, so the token has to arrive as a file — there is no way to
          # wire it straight from .env.
          #
          # authorization:
          #   type: Bearer
          #   credentials_file: /etc/prometheus/metrics_token
      
        # Prometheus' own metrics, so the scraper's health is visible on the same dashboard.
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
  grafana_datasource:
    content: |
      # Auto-provisioned at Grafana boot (#382) — this is what makes the stack zero-setup: the
      # datasource exists and is selected before anyone opens the UI.
      apiVersion: 1
      
      datasources:
        - name: Prometheus
          # Fixed uid so the committed dashboard binds to this exact datasource rather than depending on
          # a generated id or a picker variable the viewer has to resolve. Every panel in
          # ../../dashboards/ois-overview.json references this uid; change it here and you must change it
          # there too.
          uid: ois-prometheus
          type: prometheus
          access: proxy
          # Service name on the shared compose network.
          url: http://prometheus:9090
          isDefault: true
          # Provisioned datasources are immutable in the UI by default; allowing edits here means a
          # change survives until the next container restart, which is the less confusing behaviour for
          # someone tweaking a query.
          editable: true
          jsonData:
            # Matches global.scrape_interval in deploy/observability/prometheus.yml, so Grafana's
            # suggested step lines up with the real resolution.
            timeInterval: 15s
  grafana_dashboard_provider:
    content: |
      # Dashboard provider (#382). Loads every dashboard JSON committed under
      # deploy/observability/grafana/dashboards, which compose mounts at the path below.
      apiVersion: 1
      
      providers:
        - name: OIS
          type: file
          folder: OIS
          # Let the file on disk win on restart, so editing the committed JSON is how a dashboard change
          # ships — rather than a UI edit silently diverging from the repo.
          allowUiUpdates: false
          disableDeletion: false
          updateIntervalSeconds: 30
          options:
            path: /etc/grafana/dashboards
            foldersFromFilesStructure: false
