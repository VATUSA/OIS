name: CI

on:
  push:
    branches: [ main, next ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two PRs that each picked "the next free number" can both merge, leaving two migrations with one
  # version: sqlx applies both and the backend fails to start half-migrated (#569). On a PR this runs
  # against GitHub's merge ref (head merged into the current base), so a collision with anything
  # already on the base fails here. Required on `next` by ruleset; `build-images.yml` runs the same
  # check on every push, which catches the race where another PR merged after this one was checked.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/check-migration-versions.sh

  rust:
    runs-on: ubuntu-latest
    # Backs #[sqlx::test] repo tests: one throwaway database per test, migrations applied
    # automatically (auto-discovers backend/migrations — no `migrations = "..."` needed). The repo
    # layer's runtime (non-macro) sqlx queries still don't need the DB to *compile*, only to *run*
    # one of these tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ois
          POSTGRES_PASSWORD: ois
          POSTGRES_DB: ois
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ois:ois@localhost:5432/ois
    steps:
      - uses: actions/checkout@v7
      # Nightly matches rust-toolchain.toml (parallel front-end + mold linker; see .cargo/config.toml).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      # mold + clang power the fast Linux linker configured in .cargo/config.toml.
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The workspace includes desktop/src-tauri, and Tauri's Linux backend won't even `cargo
      # check` without webkit2gtk + GTK headers present. macOS/Windows use the OS webview and
      # need nothing extra (see the `desktop` job).
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --all-targets --profile ci
      # nextest doesn't run doctests, so cover them separately.
      - run: cargo test --workspace --doc

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Dependabot vulnerability alerts aren't enabled on this repo yet, so this is the active
      # JS-side advisory gate (see #89) rather than a passive GitHub setting.
      #
      # JSON takes no comments and pnpm rejects a "//" key as a selector, so every entry in root
      # package.json's `pnpm.overrides` and `pnpm.auditConfig` has its reason here: the package and
      # path, why, the tracking issue, and when to revisit. Ignores go in package.json's
      # `pnpm.auditConfig`: pnpm 9.12 rejects `pnpm audit --ignore` ("Unknown option") and does not
      # apply an `auditConfig` in pnpm-workspace.yaml. The "N vulnerabilities found" summary counts
      # ignored advisories too; `pnpm audit --json` lists only the ones still reported.
      #
      # Overrides:
      #   * `vitepress>vite: ^6.4.4` (docs-site > vitepress@1.6.4 > vite, which @vitejs/plugin-vue
      #     shares as its peer). vitepress 1.6.4 declares vite ^5.4.14, and the last vite 5 (5.4.21)
      #     still carries GHSA-587h-7wmj-h5pm (high, launch-editor) and four lower advisories; vite
      #     6.4.5 is patched and plugin-vue 5.2.4 accepts it. Origin #894. Revisit when vitepress
      #     2.0.0 ships stable (2.0.0-alpha.21 declares vite ^8.3.4), then drop the override.
      #
      # Ignores: none.
      - run: pnpm audit --audit-level=high

  desktop:
    # Proves the Tauri shell compiles on all three target platforms. `cargo check`, not
    # `tauri build` — producing (and signing) installers is distribution's job, #347.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@nightly
      # .cargo/config.toml pins clang + mold as the linker for x86_64-unknown-linux-gnu, so a
      # Linux runner without mold fails at link time.
      - if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ois-desktop --all-targets

  windows-hooks:
    # The marker hooks run in Windows sessions too (#843): every Bash, Write and Edit call goes through
    # marker-write-gate.sh. This proves the lock helper excludes a second holder on Windows and that the
    # gate passes a call that writes no marker. The hooks call `python3`, which the image may only
    # provide as `python`. autocrlf is off so the shell scripts keep their LF endings: bash reads a
    # trailing CR as part of the line (`set -uo pipefail\r` is an invalid option).
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - run: |
          if ! command -v python3 >/dev/null; then
            mkdir -p "$HOME/bin" && printf '#!/bin/bash\nexec python "$@"\n' > "$HOME/bin/python3"
            cygpath -w "$HOME/bin" >> "$GITHUB_PATH"
          fi
      - run: python3 --version && bash bin/lib/file-lock.test.sh

  deny:
    runs-on: ubuntu-latest
    # Advisories (RUSTSEC vulnerabilities) + license policy for the whole Cargo workspace, in one
    # pass. Config + rationale for any ignored advisory/allowed license lives in deny.toml.
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  client-drift:
    runs-on: ubuntu-latest
    # Catches: an endpoint or #[derive(ToSchema)] model changed without regenerating
    # @ois/api-client, leaving the web typecheck compiling against a stale contract. The OpenAPI
    # document is a pure compile-time/utoipa artifact, so this dumps it directly instead of
    # booting a live backend + DB.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ois-backend --lib openapi::dump_openapi_json -- --exact --ignored
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: OIS_OPENAPI_URL=/tmp/ois-openapi.json pnpm --filter @ois/api-client codegen
      - run: git diff --exit-code -- packages/api-client/src/generated/schema.d.ts
