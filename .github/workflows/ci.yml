name: CI

on:
  push:
    branches: [ main, next ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    # Backs #[sqlx::test] repo tests: one throwaway database per test, migrations applied
    # automatically (auto-discovers backend/migrations — no `migrations = "..."` needed). The repo
    # layer's runtime (non-macro) sqlx queries still don't need the DB to *compile*, only to *run*
    # one of these tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ois
          POSTGRES_PASSWORD: ois
          POSTGRES_DB: ois
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ois:ois@localhost:5432/ois
    steps:
      - uses: actions/checkout@v7
      # Nightly matches rust-toolchain.toml (parallel front-end + mold linker; see .cargo/config.toml).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      # mold + clang power the fast Linux linker configured in .cargo/config.toml.
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The workspace includes desktop/src-tauri, and Tauri's Linux backend won't even `cargo
      # check` without webkit2gtk + GTK headers present. macOS/Windows use the OS webview and
      # need nothing extra (see the `desktop` job).
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --all-targets --profile ci
      # nextest doesn't run doctests, so cover them separately.
      - run: cargo test --workspace --doc

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Dependabot vulnerability alerts aren't enabled on this repo yet, so this is the active
      # JS-side advisory gate (see #89) rather than a passive GitHub setting. Advisories ignored
      # pending real fixes are tracked in root package.json's `pnpm.auditConfig`, not here — pnpm
      # 9.12's documented `pnpm audit --ignore <GHSA>` flag errors ("Unknown option") despite its
      # own --help describing it, and a `pnpm-workspace.yaml`-level auditConfig is silently not
      # applied either; only the package.json `pnpm` field form actually takes effect.
      - run: pnpm audit --audit-level=high

  desktop:
    # Proves the Tauri shell compiles on all three target platforms. `cargo check`, not
    # `tauri build` — producing (and signing) installers is distribution's job, #347.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@nightly
      # .cargo/config.toml pins clang + mold as the linker for x86_64-unknown-linux-gnu, so a
      # Linux runner without mold fails at link time.
      - if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ois-desktop --all-targets

  deny:
    runs-on: ubuntu-latest
    # Advisories (RUSTSEC vulnerabilities) + license policy for the whole Cargo workspace, in one
    # pass. Config + rationale for any ignored advisory/allowed license lives in deny.toml.
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  client-drift:
    runs-on: ubuntu-latest
    # Catches: an endpoint or #[derive(ToSchema)] model changed without regenerating
    # @ois/api-client, leaving the web typecheck compiling against a stale contract. The OpenAPI
    # document is a pure compile-time/utoipa artifact, so this dumps it directly instead of
    # booting a live backend + DB.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ois-backend --lib openapi::dump_openapi_json -- --exact --ignored
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: OIS_OPENAPI_URL=/tmp/ois-openapi.json pnpm --filter @ois/api-client codegen
      - run: git diff --exit-code -- packages/api-client/src/generated/schema.d.ts
