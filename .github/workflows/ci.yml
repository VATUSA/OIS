name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nightly matches rust-toolchain.toml (parallel front-end + mold linker; see .cargo/config.toml).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      # mold + clang power the fast Linux linker configured in .cargo/config.toml.
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --all-targets --profile ci
      # nextest doesn't run doctests, so cover them separately.
      - run: cargo test --workspace --doc

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
