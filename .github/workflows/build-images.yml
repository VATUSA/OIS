name: Build images

# Build and push the backend + web images to GHCR on pushes to main and next, on version tags, and
# on demand. Deploying a given tag to dev/staging/prod is a downstream step (pull the tag you want).
#
# `next` is the integration/test-server branch (see #87): a push to it builds and tags `:next`
# (never `:latest`, which is gated to the default branch below) and auto-deploys to the test server
# via the deploy job. It never cuts prod-tagged or `:latest` images, so merging into it can't
# promote a release — only `main` and version tags do that.
on:
  push:
    branches: [main, next]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: deploy/backend.Dockerfile
          - name: web
            dockerfile: deploy/web.Dockerfile
          - name: docs
            dockerfile: deploy/docs.Dockerfile
          - name: discord
            dockerfile: deploy/discord.Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # App version = the programmer-controlled base in the root VERSION file, plus the short commit,
      # e.g. "1.0.1-a1b2c3d". Baked into every image (build-arg OIS_VERSION) and set as its
      # image.version label + a matching image tag. `image` is the lowercased repo path an OCI
      # reference requires — GITHUB_REPOSITORY keeps the org's original case (VATUSA/OIS), which
      # metadata-action lowercases for the push but a hand-built ref (e.g. Trivy's) would not.
      - name: Compute version
        id: ver
        run: |
          BASE="$(tr -d '[:space:]' < VERSION)"
          echo "version=${BASE}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}-${{ matrix.name }}"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Full version string (1.0.1-<sha>); every image's Dockerfile bakes it in.
          build-args: |
            OIS_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Scans the tag just pushed (informationally — the image is already pushed above, so this
      # can't block publishing, only mark the run). Gates on CRITICAL only: HIGH OS-package CVEs in
      # the upstream base images (e.g. nginx:1-alpine's util-linux) turn over almost weekly and can't
      # be patched on our schedule, so failing on them just keeps `main` red for issues we can't act
      # on. `ignore-unfixed` still drops CVEs with no fix available. To see (non-blocking) HIGHs too,
      # add them back to `severity`; a base-image bump is the way to actually clear them.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Tell the homelab GitOps repo which tag to run. It resolves that tag to a digest, commits it,
  # and Argo CD rolls the Deployments -- see Vainnor/homelab-infra .github/workflows/ois-deploy.yml.
  #
  # A SEPARATE JOB with `needs: build`, not a step inside it: `build` is a 4-image matrix, and a
  # step would fire four dispatches -- three of them naming images whose siblings may still be
  # mid-push, so the deploy repo could resolve a digest for backend while web is not yet there.
  # `needs` waits for all four to succeed, so one dispatch goes out once everything is published.
  #
  # `main` auto-deploys to production and `next` auto-deploys to the test server (the environment and
  # tag are worked out below). A push to a version tag still BUILDS images (see the trigger list) but
  # deploying a release is a deliberate act: run ois-deploy.yml's workflow_dispatch in the infra repo
  # with the tag you want -- a tag push does not match this job's `if` branches.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Work out what to deploy
        id: what
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            # Must match the `version` the build job computed, or the deploy repo resolves a tag
            # that was never pushed and fails.
            BASE="$(tr -d '[:space:]' < VERSION)"
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "tag=${BASE}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=next" >> "$GITHUB_OUTPUT"
            echo "tag=next" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the GitOps deploy
        env:
          # Fine-grained PAT (or GitHub App token) scoped to Vainnor/homelab-infra ONLY, with
          # Contents: read and write -- the narrowest permission GitHub offers that can send a
          # repository_dispatch. It cannot touch any other repository.
          GH_TOKEN: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          # An UNSET secret expands to an empty string, not an error. So GH_TOKEN is present in
          # this step's environment, gh still reports "set the GH_TOKEN environment variable",
          # and whoever reads the log goes looking for an env: block that is already right
          # there -- exit code 4 with no other context. Say what is actually wrong instead.
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::HOMELAB_DEPLOY_TOKEN is not set on this repository, so the deploy could not be dispatched. The images were built and pushed -- only the GitOps trigger was skipped. Create a fine-grained PAT scoped to Vainnor/homelab-infra with Contents: read and write, then: gh secret set HOMELAB_DEPLOY_TOKEN --repo VATUSA/OIS"
            exit 1
          fi
          gh api --method POST repos/Vainnor/homelab-infra/dispatches \
            -f event_type=ois-image \
            -F "client_payload[environment]=${{ steps.what.outputs.environment }}" \
            -F "client_payload[tag]=${{ steps.what.outputs.tag }}" \
            -F "client_payload[sha]=${GITHUB_SHA}"
          echo "Dispatched ${{ steps.what.outputs.environment }} -> ${{ steps.what.outputs.tag }}"
