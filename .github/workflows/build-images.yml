name: Build images

# Build and push the backend + web images to GHCR on pushes to main, on version tags, and on
# demand. Deploying a given tag to dev/staging/prod is a downstream step (pull the tag you want).
#
# Deliberately does NOT build on `next`: `next` is the integration/test-server branch (see #87) and
# merging into it should not cut new prod-tagged images. A manual `workflow_dispatch` run on `next`
# still works and tags `:next` (never `:latest`, which is gated to the default branch below) — that
# is how test-server builds happen. Do not add `next` to the push branches list.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: deploy/backend.Dockerfile
          - name: web
            dockerfile: deploy/web.Dockerfile
          - name: docs
            dockerfile: deploy/docs.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # App version = the programmer-controlled base in the root VERSION file, plus the short commit,
      # e.g. "1.0.1-a1b2c3d". Baked into every image (build-arg OIS_VERSION) and set as its
      # image.version label + a matching image tag.
      - name: Compute version
        id: ver
        run: |
          BASE="$(tr -d '[:space:]' < VERSION)"
          echo "version=${BASE}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Full version string (1.0.1-<sha>); every image's Dockerfile bakes it in.
          build-args: |
            OIS_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Scans the tag just pushed. `ignore-unfixed` skips CVEs with no available fix (pure noise
      # you can't act on yet) — only ones a dependency bump could actually resolve fail the build.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}:${{ steps.ver.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
