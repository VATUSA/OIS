version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    target-branch: next
    labels: [dependencies]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    target-branch: next
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: next
    labels: [dependencies]
