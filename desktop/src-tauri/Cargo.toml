[package]
name = "ois-desktop"
# Local/fallback base only, mirroring ois-backend. Release versioning for the shipped desktop
# app lands with distribution + auto-update (#347); tauri.conf.json omits `version` so the
# bundle inherits this one.
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
keyring.workspace = true
open.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-process.workspace = true
# `tauri::generate_context!` expands to serde_json calls once tauri.conf.json carries a plugins
# block, so it has to be in scope here even though no code of ours names it.
serde_json.workspace = true
