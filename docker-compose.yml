services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ois
      POSTGRES_PASSWORD: ois
      POSTGRES_DB: ois
    ports:
      - "5432:5432"
    volumes:
      - ois_pg:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ois" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ois_pg:
