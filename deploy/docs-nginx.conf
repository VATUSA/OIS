# Serves the static VitePress docs site. VitePress uses clean URLs (/guide → guide.html), so
# try the request, then its .html, then a directory index, then the 404 page.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed VitePress assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }
}
