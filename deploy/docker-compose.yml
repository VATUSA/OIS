# Full stack for one environment (dev / staging / prod), fronted by your own Caddy.
#
# Each service publishes a port on loopback; point Caddy at them (see deploy/Caddyfile.example):
#   api-ois.vzdc.org  ->  127.0.0.1:${API_PORT}   (backend)
#   ois.vzdc.org      ->  127.0.0.1:${WEB_PORT}    (web / SPA)
#
# The SPA is cross-origin: it calls the API at ${API_ORIGIN} (baked into the web container at
# start via OIS_API_URL). Since both are subdomains of one site, the session cookie works.
#
# Setup:  cp deploy/.env.example deploy/.env  &&  edit  &&
#         docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# (If your Caddy runs in Docker too, drop the "127.0.0.1:" prefixes and attach Caddy to this
#  compose network instead of proxying to host ports.)

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ois}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ois}
    volumes:
      - ois_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ois}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_REPO:?set IMAGE_REPO, e.g. vzdc/ois}-backend:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ois}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ois}
      BIND_ADDR: 0.0.0.0:3000
      # 1 with TLS in front (Caddy). Set 0 for plain-HTTP access (e.g. by IP), or the session
      # cookie is dropped and login silently fails.
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      # Browser origin allowed to call the API with credentials (the web app).
      CORS_ALLOWED_ORIGINS: ${WEB_ORIGIN:?e.g. https://ois.vzdc.org}
      # OAuth callback lands on the API origin.
      VATSIM_CLIENT_ID: ${VATSIM_CLIENT_ID:?}
      VATSIM_CLIENT_SECRET: ${VATSIM_CLIENT_SECRET:?}
      VATSIM_REDIRECT_URI: ${API_ORIGIN:?e.g. https://api-ois.vzdc.org}/api/v1/auth/vatsim/callback
      OIS_SERVER_ADMIN_CID: ${OIS_SERVER_ADMIN_CID:-}
      # VATUSA sync (optional; blank disables). Webhook receiver lives on the API origin.
      VATUSA_API_KEY: ${VATUSA_API_KEY:-}
      OIS_PUBLIC_URL: ${API_ORIGIN}
    ports:
      # BIND_HOST=127.0.0.1 (default) exposes the port only to the host (for a Caddy in front).
      # Set BIND_HOST=0.0.0.0 to reach it directly on the host's LAN IP.
      - "${BIND_HOST:-127.0.0.1}:${API_PORT:-3000}:3000"
    restart: unless-stopped

  web:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_REPO:?set IMAGE_REPO, e.g. vzdc/ois}-web:${IMAGE_TAG:-latest}
    environment:
      # The API origin the SPA calls (injected into /config.js at container start).
      OIS_API_URL: ${API_ORIGIN}
      # Public docs URL for the nav "Docs" link (blank hides it).
      DOCS_URL: ${DOCS_ORIGIN:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_PORT:-8080}:80"
    restart: unless-stopped

  # Static VitePress docs site (front with Caddy at e.g. docs.ois.vzdc.org).
  docs:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_REPO:?set IMAGE_REPO, e.g. vzdc/ois}-docs:${IMAGE_TAG:-latest}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${DOCS_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  ois_pg:
