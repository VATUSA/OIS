# Serves the SPA and reverse-proxies the API to the backend. `${BACKEND_URL}` is filled in at
# container start by the nginx image's envsubst.
#
# The backend host is proxied through a variable (not a literal upstream) so nginx does NOT
# resolve it at startup — it won't crash if the backend is briefly down, and it re-resolves
# via Docker's embedded DNS so a backend container restart (new IP) doesn't wedge the proxy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Docker's embedded DNS (available on user-defined / compose networks).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API + docs + health → backend. With a variable proxy_pass we must pass the URI explicitly.
    location /api/ {
        set $upstream ${BACKEND_URL};
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        set $upstream ${BACKEND_URL};
        proxy_pass $upstream$request_uri;
    }
    location /docs/ {
        set $upstream ${BACKEND_URL};
        proxy_pass $upstream$request_uri;
    }

    # SPA history fallback — everything else serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
