# Serves the OIS SPA. The API lives on its own origin (cross-origin), so there is no reverse
# proxy here — the browser calls OIS_API_URL directly (injected into /config.js at start).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The runtime config shim and the entry HTML must never be cached, so redeploys (and a new
    # OIS_API_URL / DOCS_URL) take effect immediately.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA history fallback — everything else serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
