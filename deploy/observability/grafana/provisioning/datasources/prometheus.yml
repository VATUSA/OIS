# Auto-provisioned at Grafana boot (#382) — this is what makes the stack zero-setup: the
# datasource exists and is selected before anyone opens the UI.
apiVersion: 1

datasources:
  - name: Prometheus
    # Fixed uid so the committed dashboard binds to this exact datasource rather than depending on
    # a generated id or a picker variable the viewer has to resolve. Every panel in
    # ../../dashboards/ois-overview.json references this uid; change it here and you must change it
    # there too.
    uid: ois-prometheus
    type: prometheus
    access: proxy
    # Service name on the shared compose network.
    url: http://prometheus:9090
    isDefault: true
    # Provisioned datasources are immutable in the UI by default; allowing edits here means a
    # change survives until the next container restart, which is the less confusing behaviour for
    # someone tweaking a query.
    editable: true
    jsonData:
      # Matches global.scrape_interval in deploy/observability/prometheus.yml, so Grafana's
      # suggested step lines up with the real resolution.
      timeInterval: 15s
