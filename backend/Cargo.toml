[package]
name = "ois-backend"
# Local/fallback base only; the deployed build version comes from the root VERSION file via build.rs.
version = "0.3.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "ois-backend"

[[bin]]
name = "ois-backend"
path = "src/main.rs"

[[bin]]
name = "faa-surface-importer"
path = "src/bin/faa_surface_importer.rs"

[[bin]]
name = "xplane-gate-importer"
path = "src/bin/xplane_gate_importer.rs"

[[bin]]
name = "airspace-sector-importer"
path = "src/bin/airspace_sector_importer.rs"

[dependencies]
ois-core.workspace = true

tokio.workspace = true
axum.workspace = true
axum-extra.workspace = true
tower-http.workspace = true
http.workspace = true

serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
# Encrypts the one credential OIS must read back (the VATUSA webhook secret, #605). RustCrypto, like
# `sha2`/`hmac`; XChaCha20 for its 24-byte random nonce.
chacha20poly1305 = "0.10"
time = "0.3"

thiserror.workspace = true
color-eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

utoipa.workspace = true
utoipa-swagger-ui.workspace = true

metrics.workspace = true
metrics-exporter-prometheus.workspace = true

dotenvy.workspace = true
reqwest.workspace = true

# --- nav data (runtime NASR fetch + hot-swap) ---
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
base64 = "0.22"
# Nav-fetch-only DNS resolver (A + AAAA itself, IPv4 first) — see feed/nav_dns.rs.
hickory-resolver = { version = "0.26", features = ["tokio"] }
arc-swap = "1"
governor = "0.10.4"

[dev-dependencies]
# Only for driving the real `Router` through `ServiceExt::oneshot` in the HTTP-metrics test —
# `MatchedPath` is opaque and can only be produced by actual routing, so the route-template
# labelling cannot be tested without one. Already in the tree as an axum dependency.
tower = { version = "0.5", features = ["util"] }
# Paused-time control (`start_paused`, `advance`) so the metrics upkeep task can be driven through
# its 60s timer instantly instead of the test sleeping for it. Test-only feature on the tokio the
# crate already depends on.
tokio = { workspace = true, features = ["test-util"] }
# A real websocket client for driving `/api/v1/ws` end to end (#589) — subscribe frames and the
# events they filter can't be checked from the raw HTTP handshake alone. Already in the tree as an
# axum dependency, as is futures-util.
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
