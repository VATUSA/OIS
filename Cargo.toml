[workspace]
resolver = "2"
members = [
    "backend",
    "discord",
    "crates/ois-core",
    "crates/ois-client",
    "desktop/src-tauri",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

# Versions are pinned once here and referenced by members with `<dep>.workspace = true`.
# Mirrors the versions proven in osmium so the ported permission core builds unchanged.
[workspace.dependencies]
# --- async runtime / web ---
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "fs", "sync"] }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
http = "1.3.1"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "form", "query"] }

# --- data / serialization ---
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-native-tls", "macros", "migrate", "chrono", "uuid"] }
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }

# --- crypto ---
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"

# --- errors / logging ---
thiserror = "2.0.17"
color-eyre = "0.6.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

# --- docs / openapi ---
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# --- metrics / observability ---
# `default-features = false` drops the exporter's own hyper http-listener + push-gateway; we only
# want the recorder and its text renderer, served from our own Axum route (see backend/src/metrics.rs).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# --- config ---
dotenvy = "0.15.7"

# --- desktop shell ---
# The Tauri window around the web SPA (desktop/src-tauri). Pulled into the workspace so it shares
# one lockfile and target dir, and so cargo-deny covers Tauri's dependency tree with everything else.
tauri = { version = "2.11", features = [] }
tauri-build = { version = "2.6", features = [] }
# Desktop auth (#346): the session token lives in the real OS keychain (macOS Keychain, Windows
# Credential Manager, Linux Secret Service), and sign-in opens the SYSTEM browser so the app never
# sees the user's VATSIM credentials.
# zbus (pure Rust) rather than the dbus/libsecret backend on Linux, so no system library is needed
# to build — the CI desktop job stays as it is.
keyring = { version = "4.2", features = ["apple-native-keyring-store", "windows-native-keyring-store", "zbus-secret-service-keyring-store"] }
open = "5.4"
# Auto-update (#347). The updater plugin verifies a minisign signature against the public key in
# tauri.conf.json and refuses anything that doesn't match, so package verification is its job
# rather than a weaker hand-rolled check of ours. `process` is only for relaunch().
# Native OS notifications (#348). Delivery only — what to notify about is decided in the
# frontend, where the user's own permissions and settings already apply.
tauri-plugin-notification = "2.4"
tauri-plugin-updater = "2.11"
tauri-plugin-process = "2.3"

# --- discord bot ---
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "native_tls_backend", "model"] }

# --- internal crates ---
ois-core = { path = "crates/ois-core" }
ois-client = { path = "crates/ois-client" }
